id: exp-006-kgprefetch-union
hypothesis: "A deterministic KG-prefetch SCRIPT node (file impact + co-changes + per-function caller counts) injected into all 5 specialists lets the panel drop findings on unused/validated code and weight by blast radius — raising real-set precision (exp-003 P=0.21) without losing recall. Script node = no AI-budget cost (still 5 AI nodes). output = union."
reps: 3
nodes:
  kg_prefetch:
    type: script
    run: scripts/kg-prefetch.ts
    inputs: [code]
    outputs: [context]
  security:
    prompt: prompts/security.md
    inputs: [code, kg_prefetch.context]
    outputs: [findings]
  correctness:
    prompt: prompts/correctness.md
    inputs: [code, kg_prefetch.context]
    outputs: [findings]
  concurrency:
    prompt: prompts/concurrency.md
    inputs: [code, kg_prefetch.context]
    outputs: [findings]
  validation:
    prompt: prompts/validation.md
    inputs: [code, kg_prefetch.context]
    outputs: [findings]
  edgecases:
    prompt: prompts/edgecases.md
    inputs: [code, kg_prefetch.context]
    outputs: [findings]
output: union
